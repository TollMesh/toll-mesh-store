title: TollMeshCache
description: Production-ready distributed caching and rate limiting with 7-language SDK support
baseurl: /toll-mesh-store
url: https://tollmesh.github.io
repository: TollMesh/toll-mesh-store

remote_theme: just-the-docs/just-the-docs@v0.12.0

color_scheme: dark

# Search configuration
search_enabled: true
search.heading_level: 2
search.previews: 2
search.preview_words_before: 5
search.preview_words_after: 10

# Footer
footer_content: "Copyright &copy; 2026 TollMesh. <a href=\"https://github.com/TollMesh/toll-mesh-store/blob/master/LICENSE\">Licensed under Apache 2.0</a> | <a href=\"https://github.com/TollMesh/toll-mesh-store\">GitHub</a>"

# Analytics (optional)
ga_measurement_id: ""

# Navigation - auto-discovered by just-the-docs based on nav_order frontmatter
# All .md files will be automatically discovered and ordered by nav_order

# Markdown settings
#
# syntax_highlighter_opts.block.line_numbers was previously set to true.
# Rouge's line-numbered output wraps code in a <table class="rouge-table">
# layout, which Jekyll/kramdown then wraps in its own <pre>, producing
# non-conforming double-wrapped HTML -- the theme's own (deprecated)
# fix_linenos.html workaround documents this exact issue. In practice it
# broke rendering on GitHub Pages' actual Jekyll/rouge build (literal text
# like `class="highlight">` leaking into the page instead of being
# consumed as an HTML attribute). Line numbers aren't worth that; removed.
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
