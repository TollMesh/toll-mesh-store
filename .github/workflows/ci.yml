name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  go:
    name: Go backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install TinyGo (for scripting package tests; its release tarball bundles wasm-opt too)
        run: |
          curl -L -o tinygo.tar.gz https://github.com/tinygo-org/tinygo/releases/download/v0.34.0/tinygo0.34.0.linux-amd64.tar.gz
          tar -xzf tinygo.tar.gz -C "$HOME"
          echo "$HOME/tinygo/bin" >> "$GITHUB_PATH"
      - run: go build ./...
      - run: go test ./... -v -timeout 10m

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - working-directory: sdks/python
        run: pip install -e ".[dev,async]"
      - working-directory: sdks/python
        run: pytest -v

  nodejs:
    name: Node.js SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: sdks/nodejs
        run: npm install
      - working-directory: sdks/nodejs
        run: npm test

  rust:
    name: Rust SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: sdks/rust
        run: cargo test

  csharp:
    name: C# SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - working-directory: sdks/csharp
        run: dotnet test tests/TollMeshCache.Tests.csproj

  java:
    name: Java SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - working-directory: sdks/java
        run: mvn -B test

  ruby:
    name: Ruby SDK
    runs-on: ubuntu-latest
    # This SDK's spec suite makes real HTTP calls against a live server
    # rather than mocking them, so CI has to run one.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build and start server
        run: |
          go build -o /tmp/tollmeshcache-server ./cmd/tollmeshcache
          mkdir -p /tmp/tmc-ruby-ci && cd /tmp/tmc-ruby-ci
          nohup /tmp/tollmeshcache-server -http-addr :8080 > /tmp/tmc-server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8080/health && break; sleep 0.5; done
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
      - name: Install dependencies
        working-directory: sdks/ruby
        run: gem install rspec -v "~> 3.11"
      - name: Run specs
        working-directory: sdks/ruby
        run: rspec -I lib

  php:
    name: PHP SDK
    runs-on: ubuntu-latest
    # Same as the Ruby job: this SDK's test suite hits a live server.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build and start server
        run: |
          go build -o /tmp/tollmeshcache-server ./cmd/tollmeshcache
          mkdir -p /tmp/tmc-php-ci && cd /tmp/tmc-php-ci
          nohup /tmp/tollmeshcache-server -http-addr :8080 > /tmp/tmc-server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8080/health && break; sleep 0.5; done
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:latest
      - name: Install dependencies
        working-directory: sdks/php
        run: composer install --no-interaction
      - name: Run tests
        working-directory: sdks/php
        run: ./vendor/bin/phpunit
