name: Publish C# SDK to NuGet

on:
  push:
    tags:
      - 'csharp-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Restore dependencies
        run: |
          cd sdks/csharp/
          dotnet restore

      - name: Build package
        run: |
          cd sdks/csharp/
          dotnet pack --configuration Release

      - name: Get OIDC Token from GitHub
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('nuget.org');
            core.setOutput('token', token);

      - name: Publish to NuGet (Trusted Publishing)
        run: |
          cd sdks/csharp/
          dotnet nuget push bin/Release/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.oidc.outputs.token }}" \
            --skip-duplicate
