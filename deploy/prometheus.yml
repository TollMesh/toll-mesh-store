# Example Prometheus scrape config for a TollMeshCache cluster.
#
# This is a starting point, not a finished production config: adjust
# targets, scrape_interval, and TLS settings for your actual deployment.
# It assumes each node's HTTP API is reachable at the address:port given
# and that GET /metrics/prometheus is API-key gated (see
# docs/operations.md#monitoring) -- Prometheus needs the api_key
# bearer_token (or a custom header via a relabeling/proxy setup if your
# Prometheus version doesn't support a plain bearer token the way this
# server expects X-API-Key) configured to actually reach it.
#
# GET /metrics/prometheus is this NODE's own local counters only.
# Cluster-wide totals (GET /metrics/cluster) are JSON, not Prometheus
# text format, and are not scraped by this config -- if you want
# cluster-wide totals as Prometheus metrics too, a small exporter/sidecar
# translating that JSON endpoint into Prometheus text format is the
# missing piece; this project does not ship one.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: tollmeshcache
    metrics_path: /metrics/prometheus
    scheme: http # switch to https if the cluster has -tls-cert/-tls-key set
    authorization:
      type: Bearer
      # This is NOT how X-API-Key auth actually works in this project --
      # Prometheus's built-in bearer_token sends "Authorization: Bearer
      # <token>", but api/http.go's authMiddleware checks X-API-Key
      # specifically. Use a reverse proxy, Prometheus's relabel_configs
      # with an http_headers block (Prometheus 2.47+), or a scrape
      # exporter that rewrites the header, to actually authenticate real
      # scrapes -- this file documents the intent, not a working
      # drop-in for every Prometheus version.
      credentials: "REPLACE_WITH_YOUR_API_KEY"
    static_configs:
      - targets:
          - node1.internal:8080
          - node2.internal:8080
          - node3.internal:8080
        labels:
          cluster: tollmeshcache-prod

  # If TLS (including mutual TLS) is enabled cluster-wide, uncomment and
  # point at the CA/cert Prometheus itself should present:
  # tls_config:
  #   ca_file: /etc/prometheus/tls/cluster-ca.pem
  #   cert_file: /etc/prometheus/tls/prometheus-client.pem
  #   key_file: /etc/prometheus/tls/prometheus-client-key.pem
