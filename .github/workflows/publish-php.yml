name: Publish PHP SDK to Packagist

on:
  push:
    tags:
      - 'php-v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Packagist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:latest

      - name: Validate composer.json
        run: |
          cd sdks/php/
          composer validate

      - name: Notify Packagist
        run: |
          curl -XPOST https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }} \
            -d '{"repository":{"url":"https://github.com/TollMesh/toll-mesh-store"}}'
        if: success()
