[package]
name = "tollmeshcache"
version = "1.0.0"
edition = "2021"
authors = ["TollMesh Team"]
license = "Apache-2.0"
description = "Rust SDK for TollMeshCache - Distributed CRDT-based caching"
repository = "https://github.com/toll-mesh/store"
documentation = "https://docs.rs/tollmeshcache"
keywords = ["cache", "crdt", "distributed", "rate-limiting"]
categories = ["caching", "network-programming"]

[dependencies]
tokio = { version = "1.28", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tonic = { version = "0.9", optional = true }
prost = { version = "0.11", optional = true }
prost-types = { version = "0.11", optional = true }

[dev-dependencies]
tokio-test = "0.4"
mockito = "0.31"

[features]
default = ["http"]
http = []
grpc = ["tonic", "prost", "prost-types"]

[[example]]
name = "rate_limiting"
path = "examples/rate_limiting.rs"

[[example]]
name = "replay_protection"
path = "examples/replay_protection.rs"

[[example]]
name = "caching"
path = "examples/caching.rs"
